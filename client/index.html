<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF HUB 24 - Free Online PDF Tools</title>
    <meta name="description" content="Free online PDF tools for merging, splitting, compressing, converting, and more. Fast, secure, and easy to use." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <meta name="theme-color" content="#2563eb" />
    <!-- Critical CSS for instant first paint and hero section -->
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html{-webkit-text-size-adjust:100%;font-feature-settings:normal;font-variation-settings:normal;-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
      body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,sans-serif;line-height:1.5;min-height:100vh;background:#fff;color:#0a0a0a}
      @media(prefers-color-scheme:dark){body{background:#0a0a0a;color:#fafafa}}
      #root{min-height:100vh;display:flex;flex-direction:column}
      .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
      header{position:sticky;top:0;z-index:50;background:inherit;border-bottom:1px solid rgba(0,0,0,0.1)}
      main{flex:1}
      h1{font-weight:700;letter-spacing:-0.02em}
      .container{width:100%;max-width:1280px;margin:0 auto;padding:0 1.5rem}
    </style>
    <!-- Preconnect to font origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preload the font file for faster loading -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <!-- Non-render-blocking font loading -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Google Analytics deferred to not block rendering -->
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var s = document.createElement('script');
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-NPMZN8ZRPF';
          s.async = true;
          document.head.appendChild(s);
          s.onload = function() {
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-NPMZN8ZRPF');
          };
        }, 100);
      });
    </script>
  </body>
</html>
